[package]
name = "localplay-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
localplay-capture = { path = "../capture" }
localplay-media = { path = "../media" }
tracing.workspace = true

# Media Foundation, for the hardware encoder MFT the Tier 2 zero-copy path hands GPU textures
# to (`src/mft.rs`). Only `MediaFoundation` and what that module's types reach for: the device
# manager and the D3D11 texture live in `MediaFoundation`/`Graphics::Direct3D11`, so the smaller
# `System::WinRT` spelling the plan expected is not needed. `Graphics::Direct3D11` is here for
# the probe's own device, which has to be the *same kind* the capture backend creates
# (`D3D11_CREATE_DEVICE_BGRA_SUPPORT`) for the handshake to mean anything.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Gates the software (libx264) encode path and `EncodeConfig::for_tests_software`.
# Deliberately NOT a default feature: a default would put the CPU-encoder path into
# release builds, and the project has no CPU fallback by design (spec §3.2).
test-encoders = []

# The integration tests build a software encoder, so they need the feature. Declaring
# that here (rather than making the feature a default) is what lets a bare
# `cargo test` compile: Cargo skips these targets instead of failing on a constructor
# that `cfg(feature = "test-encoders")` keeps out of the library.
[[test]]
name = "segmenting"
required-features = ["test-encoders"]

# The media timeline can only be observed against a wall clock, so this one needs the
# same gate as `segmenting`.
[[test]]
name = "timeline"
required-features = ["test-encoders"]

# The microphone is a second audio input: this test proves it lands as a second tagged
# track carrying its own audio, so it builds a software encoder too and needs the same gate.
[[test]]
name = "microphone"
required-features = ["test-encoders"]

[lints]
workspace = true
