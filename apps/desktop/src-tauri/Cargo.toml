[package]
name = "replayed-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FisiFla/replayed"
description = "replayed desktop shell — the Phase 2 session review UI (Tauri v2)"
publish = false

# Root of its own workspace: see the `exclude` note in ../../Cargo.toml for why this
# package is not a member of the repo's main workspace.
[workspace]

[dependencies]
anyhow = "1"
# Lists the audio endpoints for the settings pickers.
replayed-capture = { path = "../../../crates/capture" }
serde = { version = "1", features = ["derive"] }
# Parses the League/GSI event payloads for the match scoreboard; tests also assert the exact
# JSON keys the TypeScript interfaces mirror.
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `protocol-asset` serves clip files to the <video> element without a hand-rolled file server.
# `tray-icon` is what Tauri v2 gates `tauri::tray` and the menu API behind. `image-png` lets
# `Image::from_bytes` decode the embedded PNG tray icons (`icons/tray-*.png`). No shell or
# filesystem plugin is enabled, and no capability grants the webview anything new.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
# The folder picker for the settings panel's clips directory (`dialog:allow-open` in
# capabilities/default.json — open dialogs only, which return a path and grant no
# filesystem access beyond it).
tauri-plugin-dialog = "2"
# One running instance owns the global hotkey, the tray and the capture session.
tauri-plugin-single-instance = "2"
# The shell reads the index, edits clips and probes them with these crates, and records through
# the same engine the CLI drives (`replayed-recorder`), which owns capture, audio, the encoder
# and the ring.
replayed-media = { path = "../../../crates/media" }
replayed-store = { path = "../../../crates/store" }
replayed-recorder = { path = "../../../crates/recorder" }
# The encoder's own vocabulary: the rate-control modes and the per-vendor preset lists the
# settings panel offers. One source, so the panel and the encoder cannot disagree about what a
# vendor takes.
replayed-encoder = { path = "../../../crates/encoder" }
# The settings writer edits keys in place with their comments and formatting intact
# (`toml_edit`), rather than re-serialising structs and destroying a hand-edited file.
toml_edit = "0.25"
# The global clip hotkey: the shell installs the same `RegisterHotKey` listener as the CLI, from
# the same `[hotkeys] clip` key, so there is one hotkey implementation.
replayed-events = { path = "../../../crates/events" }
tauri-plugin-notification = "2"
# The in-app updater: the ONE thing in this application that talks to the internet, and
# it does so only when the user presses "Check for updates" in the settings panel. The
# plugin fetches one fixed GitHub URL (the release manifest, `plugins.updater.endpoints`
# in tauri.conf.json) and verifies every artifact it downloads against the minisign
# public key pinned in the same file, before it installs anything.
tauri-plugin-updater = "2"
drag = "2.1.1"
fs4 = { version = "0.13", features = ["sync"] }

# The Windows version for the diagnostics report. `RtlGetVersion` is the only call that does not
# lie about it: `GetVersionEx` reports 6.2 to an application with no manifest.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The command tests use real temporary stores and real temporary files.
tempfile = "3"
# The minisign verification the updater plugin performs, as a direct dependency so the
# test can drive it: the plugin's own copy of the check is not public API. The test
# proves the *shape* of the check — a good artifact verifies, a tampered one does not —
# with a throwaway key, and that the key pinned in tauri.conf.json is a well-formed
# minisign public key and is not that throwaway one.
minisign-verify = "0.3"
# The encoding the pinned key and every signature are written in, decoded in the test the
# same way the plugin decodes them.
base64 = "0.22"
# The integration test drives a **real** recording (a real encoder child, a real ring, a
# real splice and a real index row) through the tray's and the hotkey's trigger path. It
# needs the engine's synthetic capture source (so that no test opens a capture session on
# the host's display) and the software encoder path (this host has no GPU encoder), both of
# which are test-only entry points in the crates below — see the notes in their manifests.
# Dev-dependencies are not built for `cargo build`, so the shipping binary still has
# neither.
replayed-recorder = { path = "../../../crates/recorder", features = ["test-encoders"] }
replayed-encoder = { path = "../../../crates/encoder", features = ["test-encoders"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
