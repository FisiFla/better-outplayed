[package]
name = "localplay-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FisiFla/localplay"
description = "localplay desktop shell — the Phase 2 session review UI (Tauri v2)"
publish = false

# Root of its own workspace: see the `exclude` note in ../../Cargo.toml for why this
# package is not a member of the repo's main workspace.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `protocol-asset` is what serves clip files to the <video> element (spec §9) without a
# hand-rolled file server.
tauri = { version = "2", features = ["protocol-asset"] }
# The Phase 1 crates are reused as-is. Nothing here re-implements them, and nothing here
# touches capture: the desktop shell only reads the index, edits clips and probes them.
localplay-media = { path = "../../../crates/media" }
localplay-store = { path = "../../../crates/store" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The command tests use real temporary stores and real temporary files.
tempfile = "3"
# Contract tests assert the exact JSON keys the TypeScript interfaces mirror.
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
