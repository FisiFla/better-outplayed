# The whole-history secret scan.
#
# The scan in `.github/workflows/ci.yml` runs on every push, and the gitleaks action
# narrows it to the commits the push brought: on a push it passes
# `--log-opts=--no-merges --first-parent <base>^..<head>`, so it only ever looks at the
# lines those commits added. That is the right scope for a per-push check — it is what
# catches a credential that someone is about to commit — but it means a secret that was
# committed once, long ago, is never reported: the commit that carried it is outside the
# range, and the push that follows reports nothing.
#
# This repository is the proof. It carried a committed TLS test key in
# `crates/events/tests/fixtures/tls/key-pkcs8.pem` from 2026-09-23 until 2026-09-26, when
# the key was replaced by a chain generated at test time. No scan ever said anything about
# it, because no scan ever looked at that range. The key was never used anywhere but a
# test, and it is gone from the tree, but the history still holds it.
#
# The gitleaks action scans the *whole* history when it is triggered by `schedule` or
# `workflow_dispatch` — that is the mode it runs with no `--log-opts` at all. This
# workflow uses that mode, on a schedule, so the history is swept weekly and a credential
# that was committed long ago cannot hide in it.
#
# `.gitleaks.toml` holds the two documented exceptions, both of them test fixtures.

name: Secret scan

on:
  schedule:
    # Mondays, 04:23 UTC. Off the hour on purpose: the point of the schedule is to catch
    # what the per-push scan cannot, so it should not pile onto the top of the hour with
    # everything else on the platform.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not a shallow clone: this job exists to read commits that
          # are old.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no pull request to comment on in this mode.
          GITLEAKS_ENABLE_COMMENTS: "false"
