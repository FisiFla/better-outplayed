# ============================================================
# localplay — example configuration
# ============================================================
# Copy to the application data directory and edit:
#   %LOCALAPPDATA%\localplay\config.toml
#
# localplay never reads configuration from environment variables.

[recorder]
# What a recording is:
#
#   "buffer"  — the rolling replay buffer. A bounded scratch ring holds the last
#               seconds of play, and the hotkey (or a game event) splices a clip out
#               of it. Default, and what every build before Phase 5 did.
#
#   "session" — record the whole session. Segments are written into their own
#               directory under `sessions/` as you play, and no cap applies to them
#               (a full session is not a ring: evicting its
#               oldest segment would delete footage you asked for), and when the
#               recording stops they are concatenated losslessly into one
#               `session-<timestamp>.mp4` — never re-encoded — after which the
#               temporary segments are removed.
#
# Either way a `sessions` row is opened when recording starts and closed when it
# stops, and the hotkey still takes an instant clip from the same footage.
#
# The CLI can override this per run with `--mode session` (or `--mode buffer`).
mode = "buffer"

[buffer]
# How much footage before the trigger instant is written into the clip.
pre_seconds = 30
# How much footage after the trigger instant is written into the clip.
post_seconds = 5
# Seconds per scratch segment. This also sets the keyframe interval, and
# therefore the granularity of lossless trimming (cuts snap to <= this value).
# Lower = more precise cuts, higher = larger files.
segment_time = 1
# Empty = %LOCALAPPDATA%\localplay\scratch
scratch_dir = ""
# How much memory a replay buffer may use for the footage it has not been asked to keep,
# in bytes. Default: 256 MiB.
#
# Which footage is held is set by `pre_seconds`: this is the ceiling that keeps the
# application from being killed by the operating system when the encoder is producing
# more than that budget can hold. The oldest footage is dropped first, so a buffer that
# hits this ceiling keeps serving clips - just shorter ones, and it says so in the log
# rather than quietly returning less than was asked for.
ram_cap_bytes = 268435456

[encode]
# auto | nvenc | qsv | amf
# "auto" probes the GPU and picks the first available hardware encoder.
# If none is available localplay exits with an error rather than falling back
# to CPU encoding.
vendor = "auto"
# h264 | hevc
codec = "h264"
bitrate_kbps = 20000
# The frame rate asked for — a ceiling, not a promise. See adapt_fps below.
fps = 60
# Measure what this machine can actually sustain at the capture resolution and
# record at the lower of that and `fps` (default: true).
#
# This is a *pacing* choice, not the timeline's guarantee. Every captured frame
# costs work before it reaches the encoder — on Windows a GPU-to-CPU readback of
# the whole frame, 33 MB at 4K — and the encoder throws away whatever it cannot
# keep. Measured on 4K hardware with fps = 30: ~24 fps sustained and ~45% of
# delivered frames dropped, which is wasted work and a picture that holds
# through the dropped moments.
#
# The recorded timeline does NOT depend on this setting. Frames carry their
# arrival timestamps and the encoder no longer resamples them onto a declared
# grid, so a `pre_seconds = 10` clip is 10 real seconds of footage on a machine
# of any speed — the frames a slow machine cannot encode are simply held on
# screen. What this setting buys you is the capture work not spent on frames the
# encoder will drop, and a warning at startup instead of a surprise in the clip.
#
# With this on, localplay spends ~1.5 s at startup encoding frames at the real
# capture resolution with the selected encoder, and both the pacer and the
# encoder child are then told the rate it measured. Startup logs what it
# measured and, if that is below `fps`, warns you which rate is in use and why.
#
# false = skip the measurement and declare `fps` exactly as configured. Useful
# if the ~1.5 s of startup matters to you, or if you want to force a rate above
# what the probe measures. The frames the machine cannot encode are then dropped
# (held in the picture) and counted in the status line's `dropped=`.
adapt_fps = true
# Empty = capture at native resolution. Otherwise "WIDTHxHEIGHT", e.g. "1920x1080".
# This is also the single biggest lever on the sustainable rate: at 4K a frame is
# 33 MB, at 1080p it is 8 MB.
output_size = ""

# Hand captured frames to the hardware encoder as GPU textures, so their pixels never
# reach this process's memory. Default: false.
#
# What it removes, measured on this project's 4K box: the capture path copies 33.2 MB out
# of VRAM for every frame, which is about 97% of what the pipeline does while recording
# (`capture=` on the debug line). With this on, a hardware encoder MFT takes the captured
# texture directly and ffmpeg is told to copy the H.264 that comes out - a few hundred
# kilobytes a second across the pipe instead of gigabytes.
#
# Two things it needs, both refused at startup rather than ignored: a hardware `vendor`
# (a software encoder has no MFT to hand a texture to), and Windows (the handover is
# Media Foundation's). It also requires `output_size` to be the capture size: ffmpeg is
# copying the video rather than encoding it, so it cannot scale it, and scaling would mean
# decoding, which would mean the pixels this mode exists to keep out of memory.
#
# **Leaving this unset is the default, and it means "use it when the hardware can"**: a
# detected hardware `vendor` on Windows gets the hardware path, and anything else gets the
# ordinary one with a line in the log saying so. That is deliberate — a default that
# refused to start would be a recorder that does not record on whichever machine it was
# copied to.
#
# Setting it changes that. `true` *requires* the hardware path and refuses to start
# without it; `false` turns it off everywhere.
#
# Measured on the box it was built for: 4.0% of one core against 88.9% on the readback
# path, 59.6 fps of 60 against 55.5, and no dropped frames against 8. See
# docs/plans/2026-09-25-localplay-tier-2-zero-copy.md.
#
# zero_copy = true

[audio]
enabled = true
source = "loopback"
codec = "aac"
bitrate_kbps = 192

[storage]
# Empty = %LOCALAPPDATA%\localplay\clips
clips_dir = ""
# Default: 50 GiB. Favourited clips are exempt from this cap.
max_total_bytes = 53687091200
# Favourited clips are exempt from this limit.
max_age_days = 7

# --- The session store (Phase 5) -----------------------------------------------
# Full-session recordings, and the session rows of buffer runs, are managed by the
# *same* two rules with their own numbers: clips and sessions are evicted
# independently, so a large session library can never push your clips out (or the
# other way round). Favourited sessions are exempt from both rules, exactly as
# favourited clips are — and so is a session that is still recording: its scratch
# directory is footage that exists nowhere else yet, so the cap counts its bytes but
# never evicts it. A live recording that alone exceeds the cap is reported as an
# unsatisfiable cap rather than paid for out of the finished sessions beside it.
#
# Defaults: 200 GiB and 7 days. A 4K session is roughly 9 GB an hour at the example
# bitrate, so raise the cap if you record long sessions at 4K.
[storage.sessions]
# Empty = %LOCALAPPDATA%\localplay\sessions
sessions_dir = ""
max_total_bytes = 214748364800
max_age_days = 7

# --- The microphone (Phase 5) ---------------------------------------------------
# Record a voice track alongside the game audio. **Off by default**, and deliberately
# so: a microphone is not the game's own audio, the machine may have no capture
# endpoint at all, and a recording that silently gained a track nobody asked for is a
# surprise. With this off, the encoder is invoked exactly as it was before the feature
# existed (one audio input, no second track).
#
# With it on, every clip and every session file carries TWO audio tracks — the game
# audio first, the microphone second — and the microphone is the default
# *communications* capture endpoint (the device Windows assigns to voice chat), which
# is not configurable. On Windows this needs a capture device; if it cannot be
# started, the recording fails at start rather than producing a video with a silent
# voice track.
[mic]
enabled = false

# --- Game presence, and recording that follows it (Phase 5) ---------------------
# When `auto_record = true`, localplay watches for the titles below and records one
# session per game: recording starts when the game starts and stops (and is
# finalised, and the storage policy is applied) when it stops.
#
# **Off by default, and that is the whole safety posture of the feature**: with it
# off, nothing is polled, no process list is enumerated and no request is made — no
# watcher thread exists at all. League of Legends is detected through Riot's own
# Live Client Data API (a read-only GET to 127.0.0.1:2999, which only answers during
# a real match); every other title by comparing process names in a snapshot — the
# same enumeration Task Manager does, with nothing opened, read or injected, and no
# handle held between polls. Nothing is ever sent anywhere but loopback.
#
# `poll_ms` is how often to look; it is clamped to 250..30000. A change is believed
# after two consecutive polls, so one flickering snapshot cannot start or end a
# session.
#
# The titles watched when no `[[games.watch]]` list is given: League of Legends
# (Live Client Data API), Counter-Strike 2 (`cs2.exe`), Dota 2 (`dota2.exe`),
# Rainbow Six Siege (`RainbowSix.exe`), Valorant (`VALORANT-Win64-Shipping.exe`) and
# Overwatch 2 (`Overwatch.exe`) — always the *game* process, never the launcher's.
#
# Name your own list like this (it replaces the default one):
#   [[games.watch]]
#   name = "Dota 2"
#   exe = "dota2.exe"
#   signal = "process"            # or "live_client_api"
[games]
auto_record = false
poll_ms = 2500

[hotkeys]
clip = "Ctrl+F8"

[app]
# Start localplay with Windows (the desktop app; the CLI is never autostarted).
#
# `true`  = the app owns a value under
#           HKCU\Software\Microsoft\Windows\CurrentVersion\Run — the per-user Run key — so
#           the tray icon and the clip hotkey are there again after a reboot.
# `false` = that value is removed, if this app put it there. Nothing else in the Run key is
#           ever touched: the value name is localplay's own.
#
# The file is the only switch: this project has no settings UI, and an autostart entry that
# disagreed with the file would be a second, invisible source of truth. It is applied at
# startup, so a change needs a restart. Windows only — off Windows the app says so and does
# nothing.
start_with_system = false

[events]
# --- League of Legends (Riot's Live Client Data API) -------------------------------
# Poll https://127.0.0.1:2999/liveclientdata/allgamedata while a game is running and turn
# kills, deaths, assists, objectives and the game's start/end into clips (see the
# highlights/markers note below).
#
# The poller only ever talks to 127.0.0.1:2999 — the game's own local API. A refused
# connection is its normal state (no game running, or no League installed) and is not an
# error. The endpoint serves a self-signed certificate, so TLS verification is relaxed for
# that one address-pinned client and for nothing else.
lol_poll_enabled = true

# --- CS2 / Dota 2 (Valve Game State Integration) ------------------------------------
# The port the GSI listener binds on 127.0.0.1. Set it to 0 (or omit it) to leave the
# listener off; it never binds anything but loopback.
#
# The listener requires a token, which arrives inside the game's POST body (in the payload's
# "auth" object — that is how Valve's "auth" block works; GSI sends no Authorization
# header). localplay generates one on first use into <app data dir>/gsi-token.txt and writes
# the file you have to install to:
#   <app data dir>/gsi/cs2/gamestate_integration_localplay.cfg
#   <app data dir>/gsi/dota2/gamestate_integration_localplay.cfg
# Copy the one for the game you play into its cfg directory:
#   .../Counter-Strike Global Offensive/game/csgo/cfg/
#   .../dota 2 beta/game/dota/cfg/gamestate_integration/
# and restart the game. A payload whose token does not match is answered HTTP 403 and
# ignored; the token itself is never logged. Delete gsi-token.txt to rotate it (the
# generated cfg file must then be replaced too).
gsi_port = 45671

# --- What an event does -------------------------------------------------------------
# A *highlight* (kill, death, assist, objective, bomb planted/defused, end of game) takes a
# clip through the same trigger the hotkey uses: pre_seconds before it, post_seconds after
# it, losslessly spliced. A *marker* (a game or round starting or ending) is recorded in the
# events table so the session timeline shows it, and takes no footage — a Counter-Strike
# match would otherwise write a clip per round. Why a clip was taken is written to the same
# table, linked to the clip.
