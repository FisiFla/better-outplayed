# ============================================================
# localplay — example configuration
# ============================================================
# Copy to the application data directory and edit:
#   %LOCALAPPDATA%\localplay\config.toml
#
# localplay never reads configuration from environment variables.

[buffer]
# How much footage before the trigger instant is written into the clip.
pre_seconds = 30
# How much footage after the trigger instant is written into the clip.
post_seconds = 5
# Seconds per scratch segment. This also sets the keyframe interval, and
# therefore the granularity of lossless trimming (cuts snap to <= this value).
# Lower = more precise cuts, higher = larger files.
segment_time = 1
# Hard ceiling on the scratch directory, in bytes. Oldest segments are evicted
# first once this is exceeded. Default: 2 GiB.
scratch_cap_bytes = 2147483648
# Empty = %LOCALAPPDATA%\localplay\scratch
scratch_dir = ""

[encode]
# auto | nvenc | qsv | amf
# "auto" probes the GPU and picks the first available hardware encoder.
# If none is available localplay exits with an error rather than falling back
# to CPU encoding.
vendor = "auto"
# h264 | hevc
codec = "h264"
bitrate_kbps = 20000
fps = 60
# Empty = capture at native resolution. Otherwise "WIDTHxHEIGHT", e.g. "1920x1080".
output_size = ""

[audio]
enabled = true
source = "loopback"
codec = "aac"
bitrate_kbps = 192

[storage]
# Empty = %LOCALAPPDATA%\localplay\clips
clips_dir = ""
# Default: 50 GiB. Favourited clips are exempt from this cap.
max_total_bytes = 53687091200
# Favourited clips are exempt from this limit.
max_age_days = 7

[hotkeys]
clip = "Ctrl+F8"

[app]
# Start localplay with Windows (the desktop app; the CLI is never autostarted).
#
# `true`  = the app owns a value under
#           HKCU\Software\Microsoft\Windows\CurrentVersion\Run — the per-user Run key — so
#           the tray icon and the clip hotkey are there again after a reboot.
# `false` = that value is removed, if this app put it there. Nothing else in the Run key is
#           ever touched: the value name is localplay's own.
#
# The file is the only switch: this project has no settings UI, and an autostart entry that
# disagreed with the file would be a second, invisible source of truth. It is applied at
# startup, so a change needs a restart. Windows only — off Windows the app says so and does
# nothing.
start_with_system = false

[events]
# --- League of Legends (Riot's Live Client Data API) -------------------------------
# Poll https://127.0.0.1:2999/liveclientdata/allgamedata while a game is running and turn
# kills, deaths, assists, objectives and the game's start/end into clips (see the
# highlights/markers note below).
#
# The poller only ever talks to 127.0.0.1:2999 — the game's own local API. A refused
# connection is its normal state (no game running, or no League installed) and is not an
# error. The endpoint serves a self-signed certificate, so TLS verification is relaxed for
# that one address-pinned client and for nothing else.
lol_poll_enabled = true

# --- CS2 / Dota 2 (Valve Game State Integration) ------------------------------------
# The port the GSI listener binds on 127.0.0.1. Set it to 0 (or omit it) to leave the
# listener off; it never binds anything but loopback.
#
# The listener requires a token, which arrives inside the game's POST body (in the payload's
# "auth" object — that is how Valve's "auth" block works; GSI sends no Authorization
# header). localplay generates one on first use into <app data dir>/gsi-token.txt and writes
# the file you have to install to:
#   <app data dir>/gsi/cs2/gamestate_integration_localplay.cfg
#   <app data dir>/gsi/dota2/gamestate_integration_localplay.cfg
# Copy the one for the game you play into its cfg directory:
#   .../Counter-Strike Global Offensive/game/csgo/cfg/
#   .../dota 2 beta/game/dota/cfg/gamestate_integration/
# and restart the game. A payload whose token does not match is answered HTTP 403 and
# ignored; the token itself is never logged. Delete gsi-token.txt to rotate it (the
# generated cfg file must then be replaced too).
gsi_port = 45671

# --- What an event does -------------------------------------------------------------
# A *highlight* (kill, death, assist, objective, bomb planted/defused, end of game) takes a
# clip through the same trigger the hotkey uses: pre_seconds before it, post_seconds after
# it, losslessly spliced. A *marker* (a game or round starting or ending) is recorded in the
# events table so the session timeline shows it, and takes no footage — a Counter-Strike
# match would otherwise write a clip per round. Why a clip was taken is written to the same
# table, linked to the clip.
