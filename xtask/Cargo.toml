[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# Only for the encoder probe (`xtask probe`): the smoke test it runs is the same one the
# capture app selects a hardware encoder with (`localplay_media::smoke_test_encoder`).
# Duplicating it here would let the two answers drift apart, which is exactly the failure
# this command exists to make visible.
localplay-media.workspace = true
# `sidecars.toml` is parsed with the same TOML stack the rest of the workspace uses.
serde.workspace = true
toml.workspace = true
# SHA-256 of the downloaded archive. Pure Rust (RustCrypto): no `shasum`/`sha256sum`
# subprocess, whose presence and output format differ per platform.
sha2 = "0.10"
# Archives are read in-process with `zip` rather than by shelling out to `tar`/`unzip`.
# Two reasons, both load-bearing: Windows ships no `unzip.exe`, and the security rules
# that matter here (reject absolute paths, `..` components and symlinks; extract only
# allowlisted entries) then live in *this repository's own tested code* instead of in an
# external tool's behaviour. Default features off — localplay only ever reads stored or
# deflated entries, so the other decoders would be dead weight.
zip = { version = "5", default-features = false, features = ["deflate-flate2"] }
# The inflate backend behind `deflate-flate2` above: flate2's pure-Rust `miniz_oxide`
# backend, so building the sidecar tooling needs no C toolchain.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# `xtask verify` samples the running CLI's CPU time and working set with the same two
# Win32 calls the runbook's PowerShell recipe reads (`GetProcessTimes`,
# `K32GetProcessMemoryInfo`). Target-specific, so a non-Windows development host never
# builds it — and it is the same `windows-sys` the capture backend already pulls in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

# The same two numbers on the development host (macOS), through `proc_pid_rusage`: a
# syscall rather than the `ps` subprocess, so the harness still samples when a sandboxed
# shell denies `ps` — which is exactly what happened the first time it was run here.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
