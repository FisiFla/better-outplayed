# xtask/sidecars.toml
#
# The ffmpeg sidecars replayed ships. No binary is committed: this file is the *pin* — a
# URL plus the SHA-256 of the archive that URL is expected to serve — and
# `cargo xtask sidecars fetch` downloads the archive, checks it against the recorded hash,
# and extracts only the paths in `binaries` into <repo>/binaries/ (gitignored).
#
# `cargo xtask sidecars record` produces the hashes: it downloads each archive and rewrites
# the `sha256` lines below. The first recorded hash is trust on first use — nothing
# cryptographic attests that download — so read the URL, check it against the upstream
# project's own download instructions, and review the diff before committing it. Every later
# fetch is then checked against it and fails loudly on a mismatch instead of extracting.
#
# LGPL ffmpeg builds only: replayed never uses libx264/libx265, so GPL builds are
# unnecessary and would impose GPL obligations on the distributed app (README).
#
# The pin is BtbN's `-lgpl` variant. BtbN's README describes it as "Lacking libraries that
# are GPL-only. Most prominently libx264 and libx265", and the build's own configure line
# carries `--disable-libx264 --disable-libx265` and no `--enable-gpl`. The binary's licence
# banner reads "LGPL version 3 or later". This is *not* Gyan's "essentials" build, which
# upstream documents as GPLv3 and which does carry libx264 and libx265.
#
# The URL is a *versioned* release asset, not a moving "latest" download, so the pin stays
# valid until it is deliberately changed. BtbN keeps the last build of each month for two
# years, so a month-end tag is durable.
#
# Only the Windows target is required for shipping; the PoC's target is Windows 10 1903+.
# It is the only entry here on purpose: adding one is only worth doing when the URL's
# provenance can be named confidently, and that has not been established for a macOS or
# Linux build, so none is invented.
#
# `--target` exists so that this Windows sidecar can be fetched and inspected from any host,
# which is also how it is tested:
#   cargo xtask sidecars fetch --target x86_64-pc-windows-msvc

[[platform]]
target = "x86_64-pc-windows-msvc"
# BtbN/FFmpeg-Builds, the `win64-lgpl` variant — the build that lacks the GPL-only
# encoders replayed has no use for. See the note above on why this is not Gyan's build.
archive_url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-9.0.zip"
# Recorded with `cargo xtask sidecars record`, reviewed in the PR. `fetch` refuses to run
# while this still reads RECORD_ME.
sha256 = "6b264b9e6019103f601d98c292bd332fd87acf1c5e941ddff4fb71760fe63432"
archive_kind = "zip"
# Paths *inside the archive*. Upstream wraps everything in a versioned top-level directory
# whose name changes with every release, so each entry is matched as a path suffix and only
# the file name is kept: `bin/ffmpeg.exe` matches
# `ffmpeg-<version>-win64-lgpl/bin/ffmpeg.exe` and lands at `binaries/ffmpeg.exe`. Nothing
# outside this list is ever extracted, and an entry that is not in the archive is an error.
binaries = ["bin/ffmpeg.exe", "bin/ffprobe.exe"]
