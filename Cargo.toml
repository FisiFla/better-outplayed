[workspace]
resolver = "2"
members = [
    "crates/capture",
    "crates/encoder",
    "crates/replay",
    "crates/recorder",
    "crates/media",
    "crates/events",
    "crates/store",
    "apps/replayed-cli",
    "xtask",
]
# The Phase 2 desktop shell is a workspace of its own, and deliberately not a member:
# `tauri::generate_context!` reads `src-tauri/tauri.conf.json` at compile time and fails
# when the frontend it names (`apps/desktop/dist`) has not been built, so membership would
# make every `cargo test --workspace` depend on a `npm run build` having run first. It is
# excluded rather than merely left out, so that widening `members` to `apps/*` later
# cannot pull it in by accident. Run its tests from `apps/desktop/src-tauri`.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FisiFla/replayed"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# X.509 for test fixtures only. Deliberately WITHOUT rcgen's `crypto` feature (ring/aws-lc-rs
# need a C toolchain, which breaks the macOS -> x86_64-pc-windows-msvc `cargo check`); tests
# sign with pure-Rust p256 through rcgen's `RemoteKeyPair`.
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std", "arithmetic"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# The test leaf must be RSA: macOS Security.framework (native-tls `Identity::from_pkcs8`)
# cannot import an EC PKCS#8 key.
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
replayed-capture = { path = "crates/capture" }
replayed-encoder = { path = "crates/encoder" }
replayed-replay  = { path = "crates/replay" }
replayed-media   = { path = "crates/media" }
replayed-events  = { path = "crates/events" }
replayed-store   = { path = "crates/store" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# `warn`, not `deny`: test bodies legitimately use `unwrap()` everywhere, and
# denying it would make `cargo test` fail to compile.
unwrap_used = "warn"

# RSA key generation in the LoL TLS test fixture (`crates/events/tests/lol_mock.rs`) is
# unusably slow at opt-level 0; optimise just the bignum stack.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
