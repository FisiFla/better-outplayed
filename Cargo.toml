[workspace]
resolver = "2"
members = [
    "crates/capture",
    "crates/encoder",
    "crates/replay",
    "crates/recorder",
    "crates/media",
    "crates/events",
    "crates/store",
    "apps/localplay-cli",
    "xtask",
]
# The Phase 2 desktop shell is a workspace of its own, and deliberately not a member:
# `tauri::generate_context!` reads `src-tauri/tauri.conf.json` at compile time and fails
# when the frontend it names (`apps/desktop/dist`) has not been built, so membership would
# make every `cargo test --workspace` depend on a `npm run build` having run first. It is
# excluded rather than merely left out, so that widening `members` to `apps/*` later
# cannot pull it in by accident. Run its tests from `apps/desktop/src-tauri`.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FisiFla/better-outplayed"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
localplay-capture = { path = "crates/capture" }
localplay-encoder = { path = "crates/encoder" }
localplay-replay  = { path = "crates/replay" }
localplay-media   = { path = "crates/media" }
localplay-events  = { path = "crates/events" }
localplay-store   = { path = "crates/store" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# `warn`, not `deny`: test bodies legitimately use `unwrap()` everywhere, and
# denying it would make `cargo test` fail to compile.
unwrap_used = "warn"
