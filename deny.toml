[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # Marvin timing attack in `rsa`: only used (dev-dependency) to mint a throwaway RSA test leaf
  # for the LoL mock TLS server; no network-facing RSA operation in shipped code, no fix available.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD",
  "BSL-1.0", "OpenSSL", "CDLA-Permissive-2.0",
]

[bans]
# Duplicates are warned about, not denied: `hashbrown` arrives twice through rusqlite's
# vendored SQLite, and pinning one version of it is a rusqlite decision, not ours.
multiple-versions = "warn"
# A wildcard requirement is a version nobody reviewed. It stays allowed because
# cargo-deny cannot tell a wildcard from a workspace inheritance (`replayed-media.workspace
# = true` is not a wildcard, but it reads as one), and denying it would fail the audit on
# the project's own manifests.
wildcards = "allow"
# The zero-egress claim is only as good as the graph behind it: the League module is the one
# place allowed to build an HTTP client, and nothing else is. Denying the clients themselves
# means a future dependency cannot quietly add one, which the source-tree guard
# (`crates/events/tests/no_egress.rs`) cannot see — it reads our code, not the graph.
#
# `reqwest` and `hyper` are deliberately *not* on this list: `tauri` itself depends on
# `reqwest`, so denying them would fail the desktop shell's own audit for a crate the
# project does not choose. The guard for the app's own egress stays where it can see it —
# in the source tree.
deny = [
  "attohttpc", "isahc", "surf", "ureq",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
